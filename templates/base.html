<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solicitudes de trabajo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Solicitudes de trabajo</h1>
    <nav>
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}class="activa"{% endif %}>Listado</a>
      <a href="{{ url_for('nueva') }}" {% if request.endpoint == 'nueva' %}class="activa"{% endif %}>+ Nueva</a>
    </nav>
  </header>
  <main>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
